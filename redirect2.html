<script>
let targets = [
  "http://127.0.0.1:80",
  "http://127.0.0.1:8080",
  "http://127.0.0.1:9000",
  "http://10.11.0.1",
  "http://10.11.0.10",
  "http://10.0.0.1:80",
  "http://10.0.0.5:80",
  "http://100.100.100.201/latest/meta-data/",
];

let index = parseInt(localStorage.getItem("index") || 0);
if (index >= targets.length) index = 0;

let next = targets[index];
localStorage.setItem("index", index + 1);
location.href = next;
</script>
