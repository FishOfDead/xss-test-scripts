<script>
let targets = [
  "http://127.0.0.1:8081",
  "http://127.0.0.1:8888",
  "http://127.0.0.1:9090",
  "http://127.0.0.1:9418",
  "http://127.0.0.1:2379",
  "http://127.0.0.1:6379",
  "http://127.0.0.1:8000",
  "http://127.0.0.1:9100",
  "http://10.11.0.1:8080",
  "http://10.11.0.1:443",
  "http://10.11.0.20:8080",
  "http://10.11.0.50:8080",
  "http://10.0.0.1:443",
  "http://10.0.0.1:8080",
  "http://10.0.0.10:8080",
  "http://10.0.0.20:8080"
];

let index = 0;

function runNext() {
    if (index >= targets.length) {
        document.body.innerHTML = "所有端口测试完成";
        return;
    }
    location.href = targets[index];
    index++;
}

// 每个请求间隔 1.5 秒，避免被风控
setTimeout(runNext, 1500);
</script>
