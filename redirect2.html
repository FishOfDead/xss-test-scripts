<script>
let targets = [

  "http://127.0.0.1:8081",
  "http://127.0.0.1:8888",
  "http://127.0.0.1:9090",
  "http://127.0.0.1:9418",
  "http://127.0.0.1:2379", 
  "http://127.0.0.1:6379", 
  "http://127.0.0.1:8000",
  "http://127.0.0.1:9100",

  // 同内网网关/内部服务（泄露的 10.11.0.x）
  "http://10.11.0.1:8080",
  "http://10.11.0.1:443",
  "http://10.11.0.20:8080",
  "http://10.11.0.50:8080",

  // 金山云北京6区 内网服务
  "http://10.0.0.1:443",
  "http://10.0.0.1:8080",
  "http://10.0.0.10:8080",
  "http://10.0.0.20:8080"
];

let index = parseInt(localStorage.getItem("index") || 0);
if (index >= targets.length) index = 0;

let next = targets[index];

location.href = next;
</script>
